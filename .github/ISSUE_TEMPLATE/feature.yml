name: Feature request
description: Propose a focused improvement to NestWG
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem is not currently solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Routing and security impact
      description: Explain effects on fail-closed behavior, privileges, secrets, cleanup, and compatibility.
    validations:
      required: true
