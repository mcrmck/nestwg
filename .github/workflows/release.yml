name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Test
        run: go test ./...
      - name: Build deterministic archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          mkdir -p dist
          for arch in amd64 arm64; do
            package="nestwg_${RELEASE_TAG#v}_linux_${arch}"
            mkdir "$package"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${RELEASE_TAG#v}" \
              -o "$package/nestwg" ./cmd/nestwg
            cp README.md CHANGELOG.md LICENSE SECURITY.md SUPPORT.md "$package/"
            cp -R docs examples "$package/"
            mkdir -p "$package/share/man/man1" "$package/share/completions"
            cp docs/nestwg.1 "$package/share/man/man1/"
            cp completions/* "$package/share/completions/"
            tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner -cf - "$package" \
              | gzip -n >"dist/${package}.tar.gz"
            packaging/deb/build.sh "${RELEASE_TAG#v}" "$arch" \
              "$package/nestwg" dist
            rm -r "$package"
          done
          cd dist
          sha256sum ./*.tar.gz ./*.deb >checksums.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
